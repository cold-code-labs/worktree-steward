when:
  - event: [push, manual, tag]
    branch: main
  - event: pull_request

steps:
  - name: python-312
    image: python:3.12-slim-bookworm@sha256:34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258
    commands:
      - apt-get update -qq && apt-get install -y --no-install-recommends git lsof
      - python -m compileall -q wtpilot.py audit.py integration.py install.py tests
      - python -m unittest discover -s tests -v
  - name: python-314
    image: python:3.14-slim-bookworm@sha256:48b13b003dda20b16f9442b8475aa05fe21bf6579a8c881db92ffb4d8fd20f83
    commands:
      - apt-get update -qq && apt-get install -y --no-install-recommends git lsof
      - python -m compileall -q wtpilot.py audit.py integration.py install.py tests
      - python -m unittest discover -s tests -v
  - name: secrets
    image: alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
    commands:
      - apk add --no-cache curl tar git
      - test "$(git rev-parse --is-shallow-repository)" = false || git fetch --unshallow
      - curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
      - echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
      - tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - /tmp/gitleaks git --log-opts=--all --no-banner --redact
